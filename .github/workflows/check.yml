name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Skills and manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check skills and plugin version
        run: npm run check
